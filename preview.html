
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows 10 Web Desktop</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:white;overflow:hidden}
#desktop{
 height:100vh;
 background:linear-gradient(135deg,#0879c9,#004e92 55%,#001d50);
 position:relative;
}
#icons{padding:18px;display:grid;gap:25px;width:95px}
.app{width:75px;text-align:center;cursor:pointer;padding:6px;border:1px solid transparent}
.app:hover{background:#ffffff25;border-color:#ffffff55}
.app .emoji{font-size:34px;display:block;margin-bottom:5px}
#taskbar{
 position:absolute;bottom:0;left:0;right:0;height:48px;
 background:#171717eF;display:flex;align-items:center;gap:8px;
 padding:0 10px
}
button{cursor:pointer;color:white;border:0;font:inherit}
#startBtn{height:42px;width:45px;background:transparent;font-size:24px}
#startBtn:hover{background:#ffffff24}
#search{background:#333;border:1px solid #555;padding:8px;width:190px;color:white}
#clock{margin-left:auto;text-align:right;font-size:12px;padding:0 8px}
#startMenu{
 display:none;position:absolute;bottom:48px;left:0;width:min(350px,95vw);
 height:430px;background:#202020f5;padding:18px;
 box-shadow:0 0 20px #0007
}
#startMenu h2{font-weight:400;font-size:20px}
.startApp{display:block;width:100%;padding:12px;text-align:left;background:transparent}
.startApp:hover{background:#ffffff25}
#window{
 display:none;position:absolute;left:50%;top:45%;
 transform:translate(-50%,-50%);width:min(520px,92vw);
 min-height:230px;background:#f1f1f1;color:#222;
 box-shadow:0 10px 40px #0008
}
#titlebar{background:#0078d7;color:white;padding:10px;display:flex}
#titlebar span{flex:1}
#titlebar button{background:transparent;padding:0 8px}
#content{padding:20px}
#content button{background:#0078d7;padding:9px 14px;margin-top:8px}
</style>
</head>
<body>
<div id="desktop">
 <div id="icons">
  <div class="app" onclick="openApp('About This PC')">
   <span class="emoji">🖥️</span>This PC
  </div>
  <div class="app" onclick="openApp('Recycle Bin')">
   <span class="emoji">🗑️</span>Recycle Bin
  </div>
  <div class="app" onclick="openApp('Notepad')">
   <span class="emoji">📝</span>Notepad
  </div>
 </div>

 <div id="startMenu">
  <h2>Start</h2>
  <button class="startApp" onclick="openApp('About This PC')">🖥️ This PC</button>
  <button class="startApp" onclick="openApp('Notepad')">📝 Notepad</button>
  <button class="startApp" onclick="openApp('Settings')">⚙️ Settings</button>
  <button class="startApp" onclick="openApp('Calculator')">🧮 Calculator</button>
  <button class="startApp" onclick="openApp('Power')">⏻ Power options</button>
 </div>

 <div id="window">
  <div id="titlebar">
   <span id="windowTitle">App</span>
   <button onclick="closeApp()">✕</button>
  </div>
  <div id="content"></div>
 </div>

 <div id="taskbar">
  <button id="startBtn" onclick="toggleStart()" title="Start">⊞</button>
  <input id="search" placeholder="Type here to search">
  <span>🌐</span>
  <span>📁</span>
  <div id="clock"></div>
 </div>
</div>

<script>
const startMenu=document.getElementById('startMenu');
const win=document.getElementById('window');
const content=document.getElementById('content');

function toggleStart(){
 startMenu.style.display=
  startMenu.style.display==='block'?'none':'block';
}
function closeApp(){win.style.display='none'}
function openApp(name){
 startMenu.style.display='none';
 document.getElementById('windowTitle').textContent=name;
 win.style.display='block';

 if(name==='Notepad'){
  content.innerHTML=
   '<h2>Notepad</h2><textarea style="width:100%;height:120px" placeholder="Type something..."></textarea>';
 }else if(name==='Settings'){
  content.innerHTML=
   '<h2>Settings</h2><p>System · Personalization · Apps</p><p>This is a desktop simulation.</p>';
 }else if(name==='Calculator'){
  content.innerHTML=
   '<h2>Calculator</h2><input id="calc" type="text" placeholder="Example: 2+2"><br><button onclick="calculate()">Calculate</button><p id="answer"></p>';
 }else if(name==='Power'){
  content.innerHTML=
   '<h2>Power options</h2><p>This simulation cannot shut down your computer.</p><button onclick="closeApp()">Cancel</button>';
 }else if(name==='Recycle Bin'){
  content.innerHTML='<h2>Recycle Bin</h2><p>Recycle Bin is empty.</p>';
 }else{
  content.innerHTML='<h2>'+name+'</h2><p>Welcome to your Windows-style desktop!</p>';
 }
}
function calculate(){
 try{
  const s=document.getElementById('calc').value;
  if(!/^[0-9+*/().% -]+$/.test(s))throw Error();
  document.getElementById('answer').textContent=Function('"use strict";return ('+s+')')();
 }catch(e){document.getElementById('answer').textContent='Invalid calculation'}
}
function updateClock(){
 const d=new Date();
 document.getElementById('clock').innerHTML=
  d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'<br>'+
  d.toLocaleDateString();
}
updateClock();setInterval(updateClock,1000);
document.getElementById('search').addEventListener('keydown',e=>{
 if(e.key==='Enter'){
  const q=e.target.value.trim();
  if(q)openApp(q);
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeApp();startMenu.style.display='none'}
});
</script>
</body>
</html>
