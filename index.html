<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPS Tester</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d32;--line:#2a3857;--text:#f4f7ff;--muted:#9eacc8;--accent:#6c8cff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:system-ui,Segoe UI,Arial,sans-serif;background:radial-gradient(ellipse at top,#19284b,var(--bg) 60%);color:var(--text)}
main{width:min(760px,100%)}header{text-align:center;margin-bottom:22px}.logo{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:18px;background:#25365e;border:1px solid #425b94;font-size:28px;margin-bottom:8px}
h1{margin:0;font-size:clamp(2rem,6vw,3rem);letter-spacing:-1px}header p,.muted{color:var(--muted)}header p{margin:8px 0 0}
.panel{background:rgba(21,29,50,.95);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 60px #0005}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
label{color:var(--muted)}select,button{font:inherit}select{background:#0e1528;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}.stat{background:#0e1528;border:1px solid var(--line);border-radius:15px;padding:16px 10px;text-align:center}
.value{font-size:clamp(1.7rem,6vw,2.5rem);font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}.label{color:var(--muted);font-size:.82rem;margin-top:3px}
#clickArea{width:100%;min-height:245px;border:2px dashed #52689c;border-radius:18px;background:linear-gradient(135deg,#1a2a4d,#111b31);color:var(--text);display:grid;place-items:center;text-align:center;cursor:pointer;user-select:none;touch-action:manipulation}
#clickArea:hover{border-color:var(--accent);background:linear-gradient(135deg,#223864,#152440)}.big{font-size:1.5rem;font-weight:750}.sub{color:var(--muted);margin-top:8px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 16px;background:#202b46;color:var(--text);cursor:pointer;font-weight:650}.primary{background:var(--accent);border-color:var(--accent)}.hint{color:var(--muted);font-size:.9rem;line-height:1.55;text-align:center;margin:17px 0 0}
@media(max-width:520px){.panel{padding:14px}.stats{gap:7px}.stat{padding:12px 5px}.label{font-size:.72rem}#clickArea{min-height:220px}}
</style>
</head>
<body><main>
<header><div class="logo">⚡</div><h1>CPS Tester</h1><p>Test your clicking speed in clicks per second.</p></header>
<section class="panel">
<div class="top"><label for="duration">Test duration</label><select id="duration"><option value="5">5 seconds</option><option value="10" selected>10 seconds</option><option value="15">15 seconds</option><option value="30">30 seconds</option><option value="60">60 seconds</option></select></div>
<div class="stats" aria-live="polite"><div class="stat"><div class="value" id="cps">0.00</div><div class="label">CPS</div></div><div class="stat"><div class="value" id="clicks">0</div><div class="label">CLICKS</div></div><div class="stat"><div class="value" id="time">10.0</div><div class="label">SECONDS LEFT</div></div></div>
<button id="clickArea" type="button"><span><span class="big" id="prompt">Click here to start!</span><br><span class="sub" id="subprompt">Every click counts. Ready?</span></span></button>
<div class="actions"><button class="btn primary" id="startBtn">Start test</button><button class="btn" id="resetBtn">Reset</button></div>
<p class="hint" id="result">Choose a duration, then click the big area to begin. Your final CPS is total clicks divided by test time.</p>
</section><p class="hint">Use a mouse or tap the screen. No data is uploaded or saved.</p>
</main>
<script>
(()=>{const area=document.querySelector('#clickArea'),sel=document.querySelector('#duration'),cps=document.querySelector('#cps'),clicks=document.querySelector('#clicks'),time=document.querySelector('#time'),prompt=document.querySelector('#prompt'),sub=document.querySelector('#subprompt'),result=document.querySelector('#result'),startBtn=document.querySelector('#startBtn'),resetBtn=document.querySelector('#resetBtn');let running=false,count=0,startAt=0,endAt=0,raf=0;
const duration=()=>Number(sel.value);
function reset(){running=false;count=0;cancelAnimationFrame(raf);clicks.textContent='0';cps.textContent='0.00';time.textContent=duration().toFixed(1);prompt.textContent='Click here to start!';sub.textContent='Every click counts. Ready?';startBtn.textContent='Start test';result.textContent='Choose a duration, then click the big area to begin.'}
function finish(){running=false;cps.textContent=(count/duration()).toFixed(2);time.textContent='0.0';prompt.textContent='Test complete!';sub.textContent='Press Try again to play another round.';startBtn.textContent='Try again';result.textContent=`Result: ${count} clicks in ${duration()} seconds = ${(count/duration()).toFixed(2)} CPS.`}
function tick(){if(!running)return;const now=performance.now(),remaining=endAt-now;time.textContent=Math.max(0,remaining/1000).toFixed(1);cps.textContent=(count/Math.max(.001,(now-startAt)/1000)).toFixed(2);if(remaining<=0){finish();return}raf=requestAnimationFrame(tick)}
function begin(){reset();running=true;startAt=performance.now();endAt=startAt+duration()*1000;prompt.textContent='CLICK!';sub.textContent='Keep clicking until the timer ends.';startBtn.textContent='Test running…';tick()}
area.addEventListener('click',()=>{if(!running){begin();count=1;clicks.textContent='1';return}count++;clicks.textContent=String(count)});
startBtn.addEventListener('click',begin);resetBtn.addEventListener('click',reset);sel.addEventListener('change',reset);reset();
})();
</script></body></html>
